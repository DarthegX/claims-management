<div class="dashboard">
  <header class="dashboard__header">
    <div class="dashboard__title-group">
      <h1 class="dashboard__title">Claims Dashboard</h1>
    </div>
    <button class="dashboard__action-button" (click)="openCreateClaimDialog()">
      <span class="dashboard__action-icon">+</span>
      New Claim
    </button>
  </header>

  <div class="dashboard__grid">
    @for (claim of claims(); track claim._id) {
    <app-claim-card [claim]="claim"></app-claim-card>
    }
  </div>
</div>
